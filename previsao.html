<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Meta tags e configurações básicas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="estilos.css">
    <title>Previsão Do Tempo</title>
</head>

<body>
    <!-- Container principal da aplicação -->
    <div class="container">
        <!-- Área de busca -->
        <div class="search-box">
            <input class="cidade" placeholder="Digite o nome da cidade" onkeypress="handleKeyPress(event)">
            <button class="buscar" onclick="clickButton()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- Container das informações do clima -->
        <div class="weather-box">
            <!-- Cabeçalho com cidade e temperatura -->
            <div class="weather-header">
                <h2 class="city2">Tempo em São Paulo</h2>
                <p class="temp">21°c</p>
            </div>

            <!-- Informações detalhadas do clima -->
            <div class="weather-info">
                <!-- Área principal com ícone e descrição -->
                <div class="weather-main">
                    <img class="img_previsao" src="https://openweathermap.org/img/wn/04n.png" alt="icone-imagem">
                    <p class="textoprevisao">Nublado</p>
                </div>
                
                <!-- Grid de detalhes adicionais -->
                <div class="weather-details">
                    <!-- Umidade -->
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <p class="Umidade">Umidade: 76%</p>
                    </div>
                    <!-- Velocidade do vento -->
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <p class="vento">Vento: 0 km/h</p>
                    </div>
                    <!-- Sensação térmica -->
                    <div class="detail-item">
                        <i class="fas fa-thermometer-half"></i>
                        <p class="sensacao">Sensação: 21°c</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Script principal -->
    <script src="previsao.js"></script>
</body>

</html>
